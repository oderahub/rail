services:
  - type: worker
    name: rail-bot
    runtime: node
    plan: starter          # a free web service sleeps after 15m, which kills
                           # pushed fills and the sweeper; a worker stays up
    buildCommand: npm install -g pnpm && pnpm install --no-frozen-lockfile
    startCommand: pnpm start
    disk:
      name: rail-data
      mountPath: /data
      sizeGB: 1
    envVars:
      # node:sqlite needs 22.13+; an older default silently has no such module
      - key: NODE_VERSION
        value: 22.13.0
      - key: DATA_DIR
        value: /data
      - key: RPC_URL
        value: https://dream-rpc.somnia.network
      - key: INDEXER_URL
        value: https://dev.smk.somnia.host/v1/graphql
      - key: WS_RPC_URL
        value: wss://api.infra.testnet.somnia.network/ws
      - key: CHAIN_ID
        value: "50312"
      - key: OPERATOR_ID
        value: "2"
      - key: COLLATERAL_DECIMALS
        value: "6"
      - key: BOOK_TICK_SIZE
        value: "1000"
      - key: BOOK_LOT_SIZE
        value: "1000"
      - key: BOOK_MIN_QUANTITY
        value: "1000"
      # public on-chain identifiers, not secrets — they are already in
      # .env.example and on the signing page. Inlined so a deploy needs
      # exactly two hand-entered values and cannot be mistyped.
      - key: VENUE_ID
        value: "0x679795a0195a1b76cdebb7c51d74e058aee92919b8c3389af86ef24535e8a28c"
      - key: FACTORY_ADDRESS
        value: "0x9dd560a1f2125d730766c9aff2b32e78057a0499"
      # the only two real secrets — set in the dashboard, never in this file
      - key: PRIVATE_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
